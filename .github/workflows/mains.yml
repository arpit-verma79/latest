name: Extract ZIP and Move Filess

on:
workflow_dispatch:

permissions:
contents: write

jobs:
extract:
runs-on: ubuntu-latest

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Extract ZIP Files
    run: |
      mkdir -p temp_extract

      for file in *.zip; do
        if [ -f "$file" ]; then
          unzip -o "$file" -d temp_extract
        fi
      done

  - name: Move Files to Repository Root
    run: |
      cp -a temp_extract/. .
      rm -rf temp_extract

  - name: Commit Changes
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add -A
      git commit -m "Extract and move project files" || echo "No changes"
      git push
